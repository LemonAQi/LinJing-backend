services:
  postgres:
    image: postgres:16-alpine
    container_name: linjing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linjing
      POSTGRES_PASSWORD: linjing
      POSTGRES_DB: linjing
    ports:
      - '5432:5432'
    volumes:
      - linjing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linjing -d linjing']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linjing-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - linjing_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  linjing_pg_data:
  linjing_redis_data:
